# Nixpacks config for Railway — builds both frontend and backend in one service

[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
    "cd frontend && npm install",
    "python3 -m venv /app/venv && /app/venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "/app/venv/bin/uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port ${PORT:-8000}"
